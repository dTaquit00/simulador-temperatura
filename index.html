<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Simulador PRO Temperatura</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { font-family: Arial; margin: 0; background: #f0f2f5; }
header { background: #d85d0b; color: white; padding: 15px; text-align: center; }
.container { padding: 20px; }
.card { background: white; margin-bottom: 15px; border-radius: 10px; padding: 15px; }
button { background: #d57207; color: white; padding: 8px; border: none; cursor: pointer; }
.hidden { display: none; }
canvas { max-width: 100%; }
.slider-value { font-weight: bold; color: #1e3a8a; }
</style>
</head>

<body>

<header>
<h1>Simulador PRO de Temperatura</h1>
</header>

<div class="container">

<div class="card">
<h2>Parámetros</h2>

k: <input type="range" id="k" min="0.01" max="1" step="0.01" value="0.15">
<span id="vk">0.15</span><br>

T ambiente: <input type="range" id="Tamb" min="0" max="50" value="22">
<span id="vTamb">22</span><br>

h: <input type="range" id="h" min="0.01" max="1" step="0.01" value="0.1">
<span id="vh">0.1</span><br>

Tiempo: <input type="range" id="tf" min="10" max="100" value="50">
<span id="vtf">50</span><br>

</div>

<div class="card">
<h2>Casos</h2>
<button onclick="mostrar(1)">Caso 1</button>
<button onclick="mostrar(2)">Caso 2</button>
<button onclick="mostrar(3)">Caso 3</button>
</div>

<div id="caso1" class="card hidden">
<h3>Caso 1</h3>
T0: <input type="number" id="T1" value="25">
H: <input type="number" id="H1" value="12">
<button onclick="simular(1)">Simular</button>
<button onclick="animar(1)">Animar</button>
<p id="error1"></p>
<canvas id="graf1"></canvas>
</div>

<div id="caso2" class="card hidden">
<h3>Caso 2</h3>
T0: <input type="number" id="T2" value="80">
<button onclick="simular(2)">Simular</button>
<button onclick="animar(2)">Animar</button>
<p id="error2"></p>
<canvas id="graf2"></canvas>
</div>

<div id="caso3" class="card hidden">
<h3>Caso 3</h3>
T0: <input type="number" id="T3" value="25">
<button onclick="simular(3)">Simular</button>
<button onclick="animar(3)">Animar</button>
<p id="error3"></p>
<canvas id="graf3"></canvas>
</div>

</div>

<script>
let charts = {};

// sliders dinámicos
document.querySelectorAll("input[type=range]").forEach(el => {
    el.addEventListener("input", () => {
        document.getElementById("v"+el.id).innerText = el.value;
    });
});

function mostrar(c) {
    ["caso1","caso2","caso3"].forEach(id => {
        document.getElementById(id).classList.add("hidden");
    });
    document.getElementById("caso"+c).classList.remove("hidden");
}

function f(T,k,Tamb,H){
    return k*(Tamb-T)+H;
}

function calcular(tipo, anim=false){

    let k = parseFloat(document.getElementById("k").value);
    let Tamb = parseFloat(document.getElementById("Tamb").value);
    let h = parseFloat(document.getElementById("h").value);
    let tf = parseFloat(document.getElementById("tf").value);

    let T_e = tipo==1?parseFloat(T1.value):tipo==2?parseFloat(T2.value):parseFloat(T3.value);
    let T_r = T_e;

    let t=0;
    let tiempo=[], euler=[], rk4=[];

    function paso(){

        if(t>tf){
            // calcular error final
            let error = Math.abs(euler[euler.length-1] - rk4[rk4.length-1]);
            document.getElementById("error"+tipo).innerText =
                "Error Euler vs RK4: " + error.toFixed(4) + " °C";
            return;
        }

        let H = tipo==1?parseFloat(H1.value):
                tipo==2?0:
                10*Math.sin(t)+10;

        tiempo.push(t.toFixed(1));
        euler.push(T_e);
        rk4.push(T_r);

        // Euler
        T_e += h * f(T_e,k,Tamb,H);

        // RK4
        let k1=f(T_r,k,Tamb,H);
        let k2=f(T_r+h*k1/2,k,Tamb,H);
        let k3=f(T_r+h*k2/2,k,Tamb,H);
        let k4=f(T_r+h*k3,k,Tamb,H);

        T_r += (h/6)*(k1+2*k2+2*k3+k4);

        t += h;

        dibujar(tipo, tiempo, euler, rk4);

        if(anim){
            setTimeout(paso, 30);
        } else {
            paso(); // cálculo rápido
        }
    }

    paso();
}

function dibujar(tipo, tiempo, euler, rk4){

    let id="graf"+tipo;
    let ctx=document.getElementById(id).getContext("2d");

    if(charts[id]) charts[id].destroy();

    charts[id]=new Chart(ctx,{
        type:"line",
        data:{
            labels:tiempo,
            datasets:[
                {label:"Euler",data:euler,borderWidth:2},
                {label:"RK4",data:rk4,borderWidth:2}
            ]
        }
    });
}

function simular(t){ calcular(t,false); }
function animar(t){ calcular(t,true); }
</script>

</body>
</html>
