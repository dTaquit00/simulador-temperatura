<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Simulación de Temperatura</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f4f6f9;
        }
        header {
            background: #1e3a8a;
            color: white;
            text-align: center;
            padding: 20px;
        }
        section {
            padding: 20px;
        }
        .card {
            background: white;
            padding: 15px;
            margin: 15px 0;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        canvas {
            max-width: 100%;
        }
        button {
            background: #1e3a8a;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<header>
    <h1>Simulación de Temperatura de un Servidor</h1>
</header>

<section>

<div class="card">
    <h2>Gráfica: Euler vs RK4</h2>
    <button onclick="simular()">Generar Gráfica</button>
    <canvas id="grafica"></canvas>
</div>

</section>

<script>
function simular() {
    let k = 0.15;
    let Tamb = 22;
    let H = 12;
    let h = 0.1;
    let t_final = 50;

    let t = 0;

    let T_euler = 25;
    let T_rk4 = 25;

    let tiempo = [];
    let datosEuler = [];
    let datosRK4 = [];

    while (t <= t_final) {
        tiempo.push(t.toFixed(1));
        datosEuler.push(T_euler);
        datosRK4.push(T_rk4);

        // Euler
        T_euler = T_euler + h * (k * (Tamb - T_euler) + H);

        // RK4
        let f = (T) => k * (Tamb - T) + H;

        let k1 = f(T_rk4);
        let k2 = f(T_rk4 + h * k1 / 2);
        let k3 = f(T_rk4 + h * k2 / 2);
        let k4 = f(T_rk4 + h * k3);

        T_rk4 = T_rk4 + (h / 6) * (k1 + 2*k2 + 2*k3 + k4);

        t += h;
    }

    let ctx = document.getElementById('grafica').getContext('2d');

    if (window.miGrafica) {
        window.miGrafica.destroy();
    }

    window.miGrafica = new Chart(ctx, {
        type: 'line',
        data: {
            labels: tiempo,
            datasets: [
                {
                    label: 'Euler',
                    data: datosEuler,
                    borderWidth: 2
                },
                {
                    label: 'RK4',
                    data: datosRK4,
                    borderWidth: 2
                }
            ]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    display: true
                }
            }
        }
    });
}
</script>

</body>
</html>
