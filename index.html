<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Simulador PRO</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #1e3a8a, #2563eb);
    color: #333;
}

/* HEADER */
header {
    text-align: center;
    color: white;
    padding: 20px;
    font-size: 22px;
    font-weight: bold;
}

/* CONTENEDOR */
.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

/* TARJETAS */
.card {
    background: white;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

/* BOTONES */
button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 10px 15px;
    margin: 5px;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
}
button:hover {
    background: #1e40af;
}

/* INPUTS */
input[type=number] {
    padding: 5px;
    margin: 5px;
    border-radius: 5px;
    border: 1px solid #ccc;
}

/* SLIDERS */
input[type=range] {
    width: 100%;
}

.value {
    font-weight: bold;
    color: #2563eb;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
    gap: 15px;
}

/* OCULTO */
.hidden { display: none; }

/* ERROR */
.error {
    color: red;
    font-weight: bold;
}

/* CANVAS */
canvas {
    margin-top: 15px;
}
</style>
</head>

<body>

<header>
Simulador Profesional de Temperatura 🔥
</header>

<div class="container">

<!-- PARÁMETROS -->
<div class="card">
<h2>Parámetros del Sistema</h2>

k: <input type="range" id="k" min="0.01" max="1" step="0.01" value="0.15">
<span class="value" id="vk">0.15</span>

<br>

T ambiente: <input type="range" id="Tamb" min="0" max="50" value="22">
<span class="value" id="vTamb">22</span>

<br>

h: <input type="range" id="h" min="0.01" max="1" step="0.01" value="0.1">
<span class="value" id="vh">0.1</span>

<br>

Tiempo: <input type="range" id="tf" min="10" max="100" value="50">
<span class="value" id="vtf">50</span>

</div>

<!-- BOTONES -->
<div class="card">
<h2>Casos de Simulación</h2>
<button onclick="mostrar(1)">Caso 1 🔴</button>
<button onclick="mostrar(2)">Caso 2 ❄️</button>
<button onclick="mostrar(3)">Caso 3 📈</button>
</div>

<!-- CASOS -->
<div id="caso1" class="card hidden">
<h3>Caso 1: Carga Crítica</h3>
<div class="grid">
<div>T0 <input type="number" id="T1" value="25"></div>
<div>H <input type="number" id="H1" value="12"></div>
</div>
<button onclick="simular(1)">Simular</button>
<button onclick="animar(1)">Animar</button>
<p id="error1" class="error"></p>
<canvas id="graf1"></canvas>
</div>

<div id="caso2" class="card hidden">
<h3>Caso 2: Enfriamiento</h3>
T0 <input type="number" id="T2" value="80">
<button onclick="simular(2)">Simular</button>
<button onclick="animar(2)">Animar</button>
<p id="error2" class="error"></p>
<canvas id="graf2"></canvas>
</div>

<div id="caso3" class="card hidden">
<h3>Caso 3: Carga Variable</h3>
T0 <input type="number" id="T3" value="25">
<button onclick="simular(3)">Simular</button>
<button onclick="animar(3)">Animar</button>
<p id="error3" class="error"></p>
<canvas id="graf3"></canvas>
</div>

</div>

<script>
let charts = {};

// sliders dinámicos
document.querySelectorAll("input[type=range]").forEach(el=>{
    el.addEventListener("input",()=>{
        document.getElementById("v"+el.id).innerText = el.value;
    });
});

function mostrar(c){
    ["caso1","caso2","caso3"].forEach(id=>{
        document.getElementById(id).classList.add("hidden");
    });
    document.getElementById("caso"+c).classList.remove("hidden");
}

function f(T,k,Tamb,H){
    return k*(Tamb-T)+H;
}

function calcular(tipo, anim=false){

    let k = parseFloat(document.getElementById("k").value);
    let Tamb = parseFloat(document.getElementById("Tamb").value);
    let h = parseFloat(document.getElementById("h").value);
    let tf = parseFloat(document.getElementById("tf").value);

    let T_e = tipo==1?T1.value:tipo==2?T2.value:T3.value;
    T_e = parseFloat(T_e);
    let T_r = T_e;

    let t=0;
    let tiempo=[], euler=[], rk4=[];

    function paso(){

        if(t>tf){
            let error = Math.abs(euler[euler.length-1]-rk4[rk4.length-1]);
            document.getElementById("error"+tipo).innerText =
                "Error: "+error.toFixed(4)+" °C";
            return;
        }

        let H = tipo==1?parseFloat(H1.value):
                tipo==2?0:
                10*Math.sin(t)+10;

        tiempo.push(t.toFixed(1));
        euler.push(T_e);
        rk4.push(T_r);

        T_e += h * f(T_e,k,Tamb,H);

        let k1=f(T_r,k,Tamb,H);
        let k2=f(T_r+h*k1/2,k,Tamb,H);
        let k3=f(T_r+h*k2/2,k,Tamb,H);
        let k4=f(T_r+h*k3,k,Tamb,H);

        T_r += (h/6)*(k1+2*k2+2*k3+k4);

        t+=h;

        dibujar(tipo, tiempo, euler, rk4);

        if(anim) setTimeout(paso, 30);
        else paso();
    }

    paso();
}

function dibujar(tipo, tiempo, euler, rk4){
    let id="graf"+tipo;
    let ctx=document.getElementById(id).getContext("2d");

    if(charts[id]) charts[id].destroy();

    charts[id]=new Chart(ctx,{
        type:"line",
        data:{
            labels:tiempo,
            datasets:[
                {label:"Euler",data:euler},
                {label:"RK4",data:rk4}
            ]
        }
    });
}

function simular(t){ calcular(t,false); }
function animar(t){ calcular(t,true); }
</script>

</body>
</html>
